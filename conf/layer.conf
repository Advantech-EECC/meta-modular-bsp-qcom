BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "eecc-qualcomm"
BBFILE_PATTERN_eecc-qualcomm = "^${LAYERDIR}/"
BBFILE_PRIORITY_eecc-qualcomm = "9"
LAYERVERSION_eecc-qualcomm = "4"
LAYERSERIES_COMPAT_eecc-qualcomm = "wrynose"
